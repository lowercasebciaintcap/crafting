<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💕</title>

<style>
  body {
    background: #f2f2f2;
    text-align: center;
    font-family: "Comic Sans MS", Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  /* Crafting table button */
  #craftingTable {
    width: 380px;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #craftingTable:hover {
    transform: scale(1.05);
  }

  /* Crafting screen */
  #craftingScreen {
    position: relative;
    width: 960px;
    height: 540px;
    margin: 40px auto;
    display: none;
  }

  #craftingScreen img {
    width: 100%;
    height: 100%;
    border-radius: 12px;
  }

  /* Instruction bubble */
  #bubble {
    position: absolute;
    top: -55px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffd6eb;
    padding: 12px 22px;
    border-radius: 25px;
    font-size: 1em;
    color: #b3005e;
    box-shadow: 0 6px 15px rgba(255,105,180,0.35);
  }

  /* Masks */
  .mask {
    position: absolute;
    width: 115px;
    height: 115px;
    background: #d8d8d8;
    border-radius: 14px;
    cursor: pointer;
    transition: opacity 0.3s;
  }

  .mask:hover {
    background: #c6c6c6;
  }

  /* Grid masks */
  .m1 { top: 150px; left: 110px; }
  .m2 { top: 150px; left: 235px; }
  .m3 { top: 150px; left: 360px; }

  .m4 { top: 275px; left: 110px; }
  .m5 { top: 275px; left: 235px; }
  .m6 { top: 275px; left: 360px; }

  .m7 { top: 400px; left: 110px; }
  .m8 { top: 400px; left: 235px; }
  .m9 { top: 400px; left: 360px; }

  /* Result slot */
  .m10 {
    top: 260px;
    left: 655px;
    width: 135px;
    height: 135px;
    border-radius: 18px;
  }

  /* Glow pulse */
  .glow {
    animation: glowPulse 1.5s infinite;
  }

  @keyframes glowPulse {
    0% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
    50% { box-shadow: 0 0 25px rgba(255,105,180,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    font-size: 1.5em;
    animation: sparkle 1.2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes sparkle {
    0% { opacity: 1; transform: scale(0.5) translateY(0); }
    100% { opacity: 0; transform: scale(1.4) translateY(-40px); }
  }
</style>
</head>

<body>

<!-- Crafting Table Button -->
<img
  id="craftingTable"
  src="crafting-table.jpg"
  alt="Crafting Table"
  onclick="openCrafting()"
/>

<!-- Crafting Screen -->
<div id="craftingScreen">
  <div id="bubble">click each square to craft our picture 💗</div>

  <img src="crafting.jpg" alt="Crafting">

  <!-- Masks -->
  <div class="mask m1" onclick="reveal(this)"></div>
  <div class="mask m2" onclick="reveal(this)"></div>
  <div class="mask m3" onclick="reveal(this)"></div>

  <div class="mask m4" onclick="reveal(this)"></div>
  <div class="mask m5" onclick="reveal(this)"></div>
  <div class="mask m6" onclick="reveal(this)"></div>

  <div class="mask m7" onclick="reveal(this)"></div>
  <div class="mask m8" onclick="reveal(this)"></div>
  <div class="mask m9" onclick="reveal(this)"></div>

  <div class="mask m10" id="resultMask" onclick="reveal(this)"></div>
</div>

<!-- Music -->
<audio id="lanaMusic" src="lana.mp3" loop></audio>

<script>
  let revealed = 0;
  let musicStarted = false;

  function openCrafting() {
    document.getElementById("craftingTable").style.display = "none";
    document.getElementById("craftingScreen").style.display = "block";
  }

  function reveal(mask) {
    if (!musicStarted) {
      document.getElementById("lanaMusic").play();
      musicStarted = true;
    }

    mask.style.display = "none";
    revealed++;

    createSparkle(mask.offsetLeft + 50, mask.offsetTop + 50);

    if (revealed === 10) {
      document.getElementById("resultMask").classList.add("glow");
      burstSparkles();
    }
  }

  function createSparkle(x, y) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.style.left = x + "px";
    sparkle.style.top = y + "px";
    sparkle.textContent = "✨";
    document.getElementById("craftingScreen").appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 1200);
  }

  function burstSparkles() {
    for (let i = 0; i < 12; i++) {
      setTimeout(() => {
        createSparkle(
          680 + Math.random() * 80,
          280 + Math.random() * 80
        );
      }, i * 100);
    }
  }
</script>

</body>
</html>
