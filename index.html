<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💕</title>

<style>
  body {
    background: #ffffff;
    text-align: center;
    font-family: "Comic Sans MS", Arial, sans-serif;
    margin: 0;
    padding: 30px;
  }

  /* BIG crafting table button */
  #craftingTable {
    width: 420px;
    max-width: 90%;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #craftingTable:hover {
    transform: scale(1.08);
  }

  /* Instruction bubble */
  #bubble {
    display: none;
    background: #ffe1ef;
    color: #b3005e;
    padding: 15px 22px;
    border-radius: 20px;
    margin: 20px auto;
    width: fit-content;
    box-shadow: 0 6px 15px rgba(255,105,180,0.3);
    font-size: 1.05em;
    position: relative;
  }

  #bubble::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 12px 12px 0;
    border-style: solid;
    border-color: #ffe1ef transparent transparent;
  }

  /* Crafting screen */
  #craftingScreen {
    position: relative;
    width: 900px;
    max-width: 95%;
    margin: 25px auto;
    display: none;
  }

  #craftingScreen img {
    width: 100%;
    border-radius: 12px;
  }

  /* Mask overlays — BIGGER */
  .mask {
    position: absolute;
    width: 130px;
    height: 130px;
    background: #cfcfcf;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .mask:hover {
    background: #b8b8b8;
    transform: scale(1.03);
  }

  /* GRID MASK POSITIONS */
  .m1 { top: 135px; left: 90px; }
  .m2 { top: 135px; left: 225px; }
  .m3 { top: 135px; left: 360px; }

  .m4 { top: 270px; left: 90px; }
  .m5 { top: 270px; left: 225px; }
  .m6 { top: 270px; left: 360px; }

  .m7 { top: 405px; left: 90px; }
  .m8 { top: 405px; left: 225px; }
  .m9 { top: 405px; left: 360px; }

  /* RESULT SLOT */
  .m10 {
    top: 265px;
    left: 620px;
    width: 170px;
    height: 170px;
  }
</style>
</head>

<body>

<!-- START -->
<img
  id="craftingTable"
  src="crafting-table.jpg"
  alt="Crafting Table"
  onclick="openCrafting()"
/>

<div id="bubble">
  click each square to craft our picture 💗
</div>

<!-- CRAFTING -->
<div id="craftingScreen">
  <img src="crafting.jpg" alt="Crafting">

  <!-- GRID MASKS -->
  <div class="mask m1" onclick="reveal(this)"></div>
  <div class="mask m2" onclick="reveal(this)"></div>
  <div class="mask m3" onclick="reveal(this)"></div>

  <div class="mask m4" onclick="reveal(this)"></div>
  <div class="mask m5" onclick="reveal(this)"></div>
  <div class="mask m6" onclick="reveal(this)"></div>

  <div class="mask m7" onclick="reveal(this)"></div>
  <div class="mask m8" onclick="reveal(this)"></div>
  <div class="mask m9" onclick="reveal(this)"></div>

  <!-- FINAL RESULT -->
  <div class="mask m10" onclick="reveal(this)"></div>
</div>

<!-- AUDIO -->
<audio id="lanaMusic" src="lana.mp3" loop></audio>

<script>
  let musicStarted = false;

  function openCrafting() {
    document.getElementById("craftingTable").style.display = "none";
    document.getElementById("craftingScreen").style.display = "block";
    document.getElementById("bubble").style.display = "block";
  }

  function reveal(mask) {
    mask.style.display = "none";

    if (!musicStarted) {
      document.getElementById("lanaMusic").play();
      musicStarted = true;
    }
  }
</script>

</body>
</html>
