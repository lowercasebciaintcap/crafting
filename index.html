<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💕</title>
<style>
  body {
    background: #f2f2f2;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  /* Crafting table button */
  #craftingTable {
    width: 300px; /* made bigger */
    max-width: 80%;
    cursor: pointer;
    transition: transform 0.3s;
    border-radius: 10px;
  }

  #craftingTable:hover {
    transform: scale(1.05);
  }

  /* Crafting screen */
  #craftingScreen {
    position: relative;
    width: 1200px; /* bigger crafting image */
    max-width: 95%;
    margin: 30px auto;
    display: none;
  }

  #craftingScreen img {
    width: 100%;
    border-radius: 12px;
  }
</style>
</head>
<body>

<!-- START -->
<img id="craftingTable" src="crafting-table.jpg" alt="Crafting Table" onclick="openCrafting()" />

<!-- CRAFTING SCREEN -->
<div id="craftingScreen">
  <img src="crafting.jpg" alt="Crafting Table Big">
</div>

<!-- MUSIC -->
<audio id="music" src="ellie.mp3" loop></audio>

<script>
function openCrafting() {
  document.getElementById("craftingTable").style.display = "none";
  document.getElementById("craftingScreen").style.display = "block";
  document.getElementById("music").play();
}
</script>

</body>
</html>
