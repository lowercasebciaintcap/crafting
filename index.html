<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💕</title>

<style>
  body {
    margin: 0;
    padding: 30px;
    background: #f2f2f2;
    font-family: "Comic Sans MS", Arial, sans-serif;
    text-align: center;
  }

  /* Crafting table button */
  #craftingTable {
    width: 380px;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #craftingTable:hover {
    transform: scale(1.05);
  }

  #wrapper {
    display: none;
    max-width: 960px;
    margin: 30px auto;
  }

  /* Instruction bubble */
  #bubble {
    background: #ffd6eb;
    padding: 14px 24px;
    border-radius: 25px;
    color: #b3005e;
    margin-bottom: 20px;
    display: inline-block;
    box-shadow: 0 6px 15px rgba(255,105,180,0.35);
  }

  /* Crafting layout */
  .crafting-layout {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
  }

  /* GRID CONTAINER */
  .grid-container {
    position: relative;
    width: 420px;
    aspect-ratio: 1 / 1;
    background: url("crafting.jpg") center/cover no-repeat;
    border-radius: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    overflow: hidden;
  }

  /* MASKS */
  .mask {
    background: #d8d8d8;
    border-radius: 14px;
    cursor: pointer;
  }

  .mask:hover {
    background: #c6c6c6;
  }

  /* RESULT SLOT */
  .result {
    width: 160px;
    height: 160px;
    background: #d8d8d8;
    border-radius: 18px;
    cursor: pointer;
    position: relative;
  }

  .glow {
    animation: glowPulse 1.5s infinite;
  }

  @keyframes glowPulse {
    0% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
    50% { box-shadow: 0 0 30px rgba(255,105,180,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    font-size: 1.6em;
    animation: sparkle 1.2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes sparkle {
    from { opacity: 1; transform: scale(0.5); }
    to { opacity: 0; transform: scale(1.5) translateY(-40px); }
  }
</style>
</head>

<body>

<img id="craftingTable" src="crafting-table.jpg" onclick="startCrafting()">

<div id="wrapper">
  <div id="bubble">click each square to craft our picture 💗</div>

  <div class="crafting-layout">
    <!-- GRID -->
    <div class="grid-container" id="grid">
      <div class="mask" onclick="reveal(this)"></div>
      <div class="mask" onclick="reveal(this)"></div>
      <div class="mask" onclick="reveal(this)"></div>

      <div class="mask" onclick="reveal(this)"></div>
      <div class="mask" onclick="reveal(this)"></div>
      <div class="mask" onclick="reveal(this)"></div>

      <div class="mask" onclick="reveal(this)"></div>
      <div class="mask" onclick="reveal(this)"></div>
      <div class="mask" onclick="reveal(this)"></div>
    </div>

    <!-- RESULT -->
    <div class="result" id="result" onclick="revealResult()"></div>
  </div>
</div>

<audio id="lana" src="lana.mp3" loop></audio>

<script>
  let revealed = 0;
  let started = false;

  function startCrafting() {
    document.getElementById("craftingTable").style.display = "none";
    document.getElementById("wrapper").style.display = "block";
  }

  function reveal(mask) {
    if (!started) {
      document.getElementById("lana").play();
      started = true;
    }

    if (mask.style.visibility === "hidden") return;

    mask.style.visibility = "hidden";
    revealed++;

    sparkle(mask);

    if (revealed === 9) {
      document.getElementById("result").classList.add("glow");
      for (let i = 0; i < 12; i++) {
        setTimeout(() => sparkle(document.getElementById("result")), i * 120);
      }
    }
  }

  function revealResult() {
    if (revealed < 9) return;
    document.getElementById("result").style.background =
      'url("final.jpg") center/cover no-repeat';
  }

  function sparkle(target) {
    const rect = target.getBoundingClientRect();
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = "✨";
    s.style.left = rect.width / 2 + "px";
    s.style.top = rect.height / 2 + "px";
    target.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
</script>

</body>
</html>
