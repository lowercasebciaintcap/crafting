<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💕</title>

<style>
  body {
    margin: 0;
    padding: 30px;
    background: #f2f2f2;
    font-family: "Comic Sans MS", Arial, sans-serif;
    text-align: center;
  }

  /* Crafting table button */
  #craftingTable {
    width: 380px;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #craftingTable:hover {
    transform: scale(1.05);
  }

  /* Crafting wrapper */
  #craftingWrapper {
    display: none;
    width: 960px;
    max-width: 95vw;
    margin: 40px auto;
    position: relative;
  }

  /* Instruction bubble */
  #bubble {
    background: #ffd6eb;
    padding: 12px 22px;
    border-radius: 25px;
    color: #b3005e;
    margin-bottom: 15px;
    display: inline-block;
    box-shadow: 0 6px 15px rgba(255,105,180,0.35);
  }

  /* Image container (THIS IS KEY) */
  #craftingContainer {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
  }

  #craftingContainer img {
    width: 100%;
    height: 100%;
    border-radius: 12px;
  }

  /* Masks */
  .mask {
    position: absolute;
    background: #d8d8d8;
    border-radius: 14px;
    cursor: pointer;
  }

  .mask:hover {
    background: #c6c6c6;
  }

  /* GRID MASKS — PERCENT BASED */
  .m1 { top: 28%; left: 12%; }
  .m2 { top: 28%; left: 25%; }
  .m3 { top: 28%; left: 38%; }

  .m4 { top: 45%; left: 12%; }
  .m5 { top: 45%; left: 25%; }
  .m6 { top: 45%; left: 38%; }

  .m7 { top: 62%; left: 12%; }
  .m8 { top: 62%; left: 25%; }
  .m9 { top: 62%; left: 38%; }

  /* RESULT SLOT */
  .m10 {
    top: 45%;
    left: 68%;
    width: 14%;
    height: 22%;
    border-radius: 18px;
  }

  /* Shared size for grid */
  .m1,.m2,.m3,.m4,.m5,.m6,.m7,.m8,.m9 {
    width: 11%;
    height: 18%;
  }

  /* Glow */
  .glow {
    animation: glowPulse 1.5s infinite;
  }

  @keyframes glowPulse {
    0% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
    50% { box-shadow: 0 0 25px rgba(255,105,180,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
  }

  /* Sparkle */
  .sparkle {
    position: absolute;
    font-size: 1.5em;
    animation: sparkle 1.2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes sparkle {
    from { opacity: 1; transform: scale(0.5); }
    to { opacity: 0; transform: scale(1.4) translateY(-40px); }
  }
</style>
</head>

<body>

<img id="craftingTable" src="crafting-table.jpg" onclick="openCrafting()">

<div id="craftingWrapper">
  <div id="bubble">click each square to craft our picture 💗</div>

  <div id="craftingContainer">
    <img src="crafting.jpg">

    <div class="mask m1" onclick="reveal(this)"></div>
    <div class="mask m2" onclick="reveal(this)"></div>
    <div class="mask m3" onclick="reveal(this)"></div>

    <div class="mask m4" onclick="reveal(this)"></div>
    <div class="mask m5" onclick="reveal(this)"></div>
    <div class="mask m6" onclick="reveal(this)"></div>

    <div class="mask m7" onclick="reveal(this)"></div>
    <div class="mask m8" onclick="reveal(this)"></div>
    <div class="mask m9" onclick="reveal(this)"></div>

    <div class="mask m10" id="resultMask" onclick="reveal(this)"></div>
  </div>
</div>

<audio id="lana" src="lana.mp3" loop></audio>

<script>
  let revealed = 0;
  let started = false;

  function openCrafting() {
    document.getElementById("craftingTable").style.display = "none";
    document.getElementById("craftingWrapper").style.display = "block";
  }

  function reveal(mask) {
    if (!started) {
      document.getElementById("lana").play();
      started = true;
    }

    mask.style.display = "none";
    revealed++;

    sparkle(mask.offsetLeft + mask.offsetWidth / 2,
             mask.offsetTop + mask.offsetHeight / 2);

    if (revealed === 10) {
      document.getElementById("resultMask").classList.add("glow");
      for (let i = 0; i < 10; i++) {
        setTimeout(() => sparkle(720 + Math.random()*60, 260 + Math.random()*60), i*120);
      }
    }
  }

  function sparkle(x, y) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.textContent = "✨";
    document.getElementById("craftingContainer").appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
</script>

</body>
</html>
