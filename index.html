<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💕</title>

<style>
  body {
    background: #f2f2f2;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  /* Crafting table button */
  #craftingTable {
    width: 220px;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #craftingTable:hover {
    transform: scale(1.05);
  }

  /* Crafting screen */
  #craftingScreen {
    position: relative;
    width: 900px;
    max-width: 95%;
    margin: 30px auto;
    display: none;
  }

  #craftingScreen img {
    width: 100%;
    border-radius: 10px;
  }

  /* Mask overlays */
  .mask {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #bcbcbc;
    border-radius: 8px;
    cursor: pointer;
  }

  .mask:hover {
    background: #a5a5a5;
  }

  /* CRAFTING GRID MASKS */
  .m1 { top: 130px; left: 85px; }
  .m2 { top: 130px; left: 190px; }
  .m3 { top: 130px; left: 295px; }

  .m4 { top: 235px; left: 85px; }
  .m5 { top: 235px; left: 190px; }
  .m6 { top: 235px; left: 295px; }

  .m7 { top: 340px; left: 85px; }
  .m8 { top: 340px; left: 190px; }
  .m9 { top: 340px; left: 295px; }

  /* RESULT SLOT MASK (10th) */
  .m10 {
    top: 210px;
    left: 610px;
    width: 140px;
    height: 140px;
  }
</style>
</head>

<body>

<!-- START -->
<img
  id="craftingTable"
  src="crafting-table.jpg"
  alt="Crafting Table"
  onclick="openCrafting()"
/>

<!-- CRAFTING -->
<div id="craftingScreen">
  <img src="crafting.jpg" alt="Crafting">

  <!-- GRID MASKS -->
  <div class="mask m1" onclick="reveal(this)"></div>
  <div class="mask m2" onclick="reveal(this)"></div>
  <div class="mask m3" onclick="reveal(this)"></div>

  <div class="mask m4" onclick="reveal(this)"></div>
  <div class="mask m5" onclick="reveal(this)"></div>
  <div class="mask m6" onclick="reveal(this)"></div>

  <div class="mask m7" onclick="reveal(this)"></div>
  <div class="mask m8" onclick="reveal(this)"></div>
  <div class="mask m9" onclick="reveal(this)"></div>

  <!-- FINAL RESULT MASK -->
  <div class="mask m10" onclick="reveal(this)"></div>
</div>

<script>
  function openCrafting() {
    document.getElementById("craftingTable").style.display = "none";
    document.getElementById("craftingScreen").style.display = "block";
  }

  function reveal(mask) {
    mask.style.display = "none";
  }
</script>

</body>
</html>
