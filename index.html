<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Crafting 💗</title>
<style>
  body {
    background: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
  }

  .crafting-wrapper {
    position: relative;
    display: inline-block;
  }

  /* Background image */
  .crafting-bg {
    width: 900px;
    max-width: 100%;
    display: block;
  }

  /* 3x3 Grid */
  .grid {
    position: absolute;
    top: 130px;
    left: 105px;
    width: 360px;
    height: 360px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
  }

  .cell {
    background: #cfcfcf;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden; /* keeps images inside */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* perfectly fills the cell */
    display: block;
    opacity: 0; /* hidden initially */
    transition: opacity 0.3s ease;
  }

  .cell.revealed {
    background: transparent;
  }

  .cell.revealed img {
    opacity: 1;
  }

  /* Result slot */
  .result {
    position: absolute;
    top: 250px;
    left: 645px;
    width: 150px;
    height: 150px;
    background: #cfcfcf;
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
  }

  .result img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    border-radius: 12px;
    transition: opacity 0.3s ease;
  }

  .result.unlocked img {
    opacity: 1;
  }

  .glow {
    animation: glow 1.4s infinite;
  }

  @keyframes glow {
    0% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
    50% { box-shadow: 0 0 30px rgba(255,105,180,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,105,180,0.6); }
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    font-size: 1.5em;
    animation: sparkle 1s ease-out forwards;
    pointer-events: none;
  }

  @keyframes sparkle {
    from { opacity: 1; transform: scale(0.5); }
    to { opacity: 0; transform: scale(1.5) translateY(-30px); }
  }
</style>
</head>
<body>

<div class="crafting-wrapper">

  <img src="crafting.jpg" class="crafting-bg" alt="Crafting Background">

  <!-- 3x3 Grid -->
  <div class="grid" id="grid">
    <div class="cell" onclick="reveal(this)"><img src="1.png" alt="Item 1"></div>
    <div class="cell" onclick="reveal(this)"><img src="2.png" alt="Item 2"></div>
    <div class="cell" onclick="reveal(this)"><img src="3.png" alt="Item 3"></div>
    <div class="cell" onclick="reveal(this)"><img src="4.png" alt="Item 4"></div>
    <div class="cell" onclick="reveal(this)"><img src="5.png" alt="Item 5"></div>
    <div class="cell" onclick="reveal(this)"><img src="6.png" alt="Item 6"></div>
    <div class="cell" onclick="reveal(this)"><img src="7.png" alt="Item 7"></div>
    <div class="cell" onclick="reveal(this)"><img src="8.png" alt="Item 8"></div>
    <div class="cell" onclick="reveal(this)"><img src="9.png" alt="Item 9"></div>
  </div>

  <!-- Result -->
  <div class="result" id="result" onclick="revealResult()">
    <img src="final.jpg" alt="Final Result">
  </div>

</div>

<audio id="music" src="lana.mp3" loop></audio>

<script>
  let count = 0;
  let started = false;

  function reveal(cell) {
    if (cell.classList.contains("revealed")) return;

    if (!started) {
      document.getElementById("music").play();
      started = true;
    }

    cell.classList.add("revealed");
    count++;
    sparkle(cell);

    if (count === 9) {
      const result = document.getElementById("result");
      result.classList.add("glow");
      for (let i = 0; i < 8; i++) {
        setTimeout(() => sparkle(result), i * 120);
      }
    }
  }

  function revealResult() {
    if (count < 9) return;
    document.getElementById("result").classList.add("unlocked");
  }

  function sparkle(el) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = "✨";
    s.style.left = "50%";
    s.style.top = "50%";
    el.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
</script>

</body>
</html>
